services:
  backend:
    build:
      context: ./foodie-backend
      dockerfile: Dockerfile
    container_name: foodie-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./foodie-backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
    networks:
      - foodie-network

  frontend:
    build:
      context: ./foodie-frontend
      dockerfile: Dockerfile
    container_name: foodie-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - foodie-network

networks:
  foodie-network:
    driver: bridge

